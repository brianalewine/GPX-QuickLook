<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:#20252b;background:#fff;height:100vh;display:flex;flex-direction:column}header{padding:16px 20px;border-bottom:1px solid #00000010}h1{font-size:16px;margin:0 0 14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stats{display:grid;grid-template-columns:1.4fr 1.4fr 1fr .8fr;gap:16px}.stat span{display:block;color:#82878e;font-size:11px;margin-bottom:4px}.stat strong{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}#mapWrap{position:relative;flex:1;display:flex;min-height:0}#map{flex:1;background:#edf0ed}.marker{width:16px;height:16px;border:2px solid white;border-radius:50%;box-shadow:0 1px 3px #0005}.start{background:#20a35a}.finish{background:conic-gradient(#242424 25%,#fff 0 50%,#242424 0 75%,#fff 0);background-size:7px 7px}button{font:12px -apple-system,sans-serif;color:#32383e;background:#fffefb;border:1px solid #00000014;border-radius:7px;padding:7px 10px;cursor:pointer;box-shadow:0 1px 5px #00000012}button:hover{background:#f1f3f4}button:focus-visible{outline:2px solid #2374dc;outline-offset:2px}#fit{position:absolute;bottom:12px;left:12px;z-index:800;width:32px;height:32px;padding:7px}button svg{display:block;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}#minimapPanel{position:absolute;right:12px;top:12px;z-index:800;width:180px;height:130px}#minimapPanel[hidden]{display:none}#collapse{position:absolute;right:5px;top:5px;z-index:810;padding:5px;opacity:0;transition:opacity .15s}#minimapPanel:hover #collapse,#minimapPanel:focus-within #collapse{opacity:1}#minimapPanel.collapsed{width:28px;height:28px}#minimapPanel.collapsed #collapse{opacity:1;top:0;right:0}#minimapPanel.collapsed #collapse svg{transform:rotate(180deg)}#minimap{position:absolute;inset:0;border:3px solid white;border-radius:9px;box-shadow:0 2px 12px #0003;z-index:800;overflow:hidden;background:#edf0ed}#minimap[hidden],#status[hidden]{display:none}#status{position:absolute;bottom:12px;left:54px;z-index:800;background:#fffffff2;border-radius:7px;padding:8px 10px;box-shadow:0 1px 6px #0002;font-size:12px;color:#62686e}#retry{margin-left:8px;padding:3px 7px}.leaflet-control-zoom{border:0!important;box-shadow:0 1px 5px #0002!important;border-radius:7px!important;overflow:hidden}.leaflet-control-zoom a{color:#40474e!important;font-weight:400!important}.leaflet-control-attribution{font-size:10px!important;background:#ffffffd9!important}#minimap .leaflet-control-container{display:none}@media(max-width:650px){header{padding:12px 14px}.stats{grid-template-columns:1fr 1fr;gap:12px}#minimapPanel:not(.collapsed){width:145px;height:110px}}
</style></head><body><header><h1 id="name"></h1><div class="stats"><div class="stat"><span>Start</span><strong id="start"></strong></div><div class="stat"><span>Finish</span><strong id="finish"></strong></div><div class="stat"><span>Duration</span><strong id="duration"></strong></div><div class="stat"><span>Distance</span><strong id="distance"></strong></div></div></header><div id="mapWrap"><div id="map"></div><button id="fit" title="Zoom to fit" aria-label="Zoom to fit"><svg viewBox="0 0 20 20"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg></button><div id="minimapPanel" hidden><div id="minimap" aria-label="Track overview"></div><button id="collapse" title="Collapse minimap" aria-label="Collapse minimap" aria-expanded="true"><svg viewBox="0 0 20 20"><path d="m6 13 7-7M6 6h7v7"/></svg></button></div><div id="status" hidden><span>Some map tiles couldn’t load.</span><button id="retry">Retry</button></div></div><script src="leaflet.js"></script><script>
const data=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('__TRACK_BASE64__'),c=>c.charCodeAt(0))));
for(const key of ['name','start','finish','duration','distance'])document.getElementById(key).textContent=data[key];
// Keep fractional coordinates throughout a gesture instead of rounding the origin each frame.
const PreciseMap=L.Map.extend({
 _getNewPixelOrigin:function(center,zoom){return this.project(center,zoom).subtract(this.getSize().divideBy(2)).add(this._getMapPanePos());},
 latLngToLayerPoint:function(latlng){return this.project(L.latLng(latlng)).subtract(this.getPixelOrigin());}
});
const map=new PreciseMap('map',{zoomControl:true,scrollWheelZoom:false,zoomAnimation:true,fadeAnimation:false,zoomSnap:0,zoomDelta:.5,maxZoom:24});map.attributionControl.setPrefix(false);
const tileURL='gpx-tile://osm/{z}/{x}/{y}.png';
// Leaflet's hard reset discards every image on each fractional zoom frame.
// Retain loaded levels and decoded images so zooming and returning to fit never start blank.
const RetainedTiles=L.TileLayer.extend({
 initialize:function(url,options){L.TileLayer.prototype.initialize.call(this,url,options);this.decoded=new Map();},
 _setZoomTransform:function(level,center,zoom){
  const scale=this._map.getZoomScale(zoom,level.zoom);
  const translate=level.origin.multiplyBy(scale).subtract(this._map._getNewPixelOrigin(center,zoom));
  L.DomUtil.setTransform(level.el,translate,scale);
 },
 getEvents:function(){const events=L.TileLayer.prototype.getEvents.call(this);delete events.viewprereset;return events;},
 createTile:function(coords,done){
  const key=this._tileCoordsToKey(coords),cached=this.decoded.get(key);
  if(cached){this.decoded.delete(key);cached.className='';cached.style.cssText='';delete cached.dataset.failed;setTimeout(()=>done(null,cached),0);return cached;}
  return L.TileLayer.prototype.createTile.call(this,coords,done);
 },
 _removeTile:function(key){
  const record=this._tiles[key];
  if(record&&record.el.complete&&record.el.naturalWidth&&!record.el.dataset.failed){
   L.DomEvent.off(record.el);this.decoded.set(key,record.el);
   while(this.decoded.size>128)this.decoded.delete(this.decoded.keys().next().value);
   L.GridLayer.prototype._removeTile.call(this,key);
  }else L.TileLayer.prototype._removeTile.call(this,key);
 }
});
const tiles=new RetainedTiles(tileURL,{maxZoom:24,maxNativeZoom:19,updateWhenZooming:false,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
// Judge current visible tiles, never latch an error from a cancelled or past request.
let statusTimer;
function updateTileStatus(){clearTimeout(statusTimer);statusTimer=setTimeout(()=>{const current=Object.values(tiles._tiles).filter(t=>t.current);const failed=current.some(t=>t.el.dataset.failed==='true');document.getElementById('status').hidden=!failed;},500);}
tiles.on('tileerror',e=>{e.tile.dataset.failed='true';updateTileStatus();});
tiles.on('tileload',e=>{delete e.tile.dataset.failed;updateTileStatus();});
tiles.on('load tileunload',updateTileStatus);
document.getElementById('retry').onclick=()=>{document.getElementById('status').hidden=true;tiles.redraw();if(miniTiles)miniTiles.redraw();};
let previous;
const segments=data.segments.map(segment=>segment.map(([lat,lon])=>{if(previous!==undefined){while(lon-previous>180)lon-=360;while(lon-previous< -180)lon+=360;}previous=lon;return [Math.max(-85.05112878,Math.min(85.05112878,lat)),lon];}));
const line=L.polyline(segments,{color:'#2878d7',weight:3.5,opacity:.95,lineCap:'round'}).addTo(map);
const points=segments.flat();
function marker(point,kind,label){const loop=L.latLng(points[0]).equals(L.latLng(points[points.length-1]),.00001);return L.marker(point,{title:label,icon:L.divIcon({className:'',html:'<div class="marker '+kind+'"></div>',iconSize:[16,16],iconAnchor:loop?(kind==='start'?[15,8]:[1,8]):[8,8]}),zIndexOffset:kind==='finish'?100:0}).addTo(map).bindTooltip(label);}
marker(points[0],'start','Start');marker(points[points.length-1],'finish','Finish');
let fitZoom=0,mini=null,miniTiles=null,viewport=null,fitting=false;
let minimapEnabled=window.gpxMinimapEnabled!==false;
const panel=document.getElementById('minimapPanel');
const collapse=document.getElementById('collapse');
function updateMinimap(event){
 if(fitting)return;
 let visibleBounds=map.getBounds();
 if(event&&event.type==='zoomanim'){
  const center=map.project(event.center,event.zoom),half=map.getSize().divideBy(2);
  visibleBounds=L.latLngBounds(map.unproject(center.subtract(half),event.zoom),map.unproject(center.add(half),event.zoom));
 }
 const visible=!visibleBounds.contains(line.getBounds());
 panel.hidden=!visible;if(!visible)return;
 panel.classList.toggle('collapsed',!minimapEnabled);
 document.getElementById('minimap').hidden=!minimapEnabled;
 collapse.setAttribute('aria-expanded',String(minimapEnabled));
 collapse.title=collapse.ariaLabel=minimapEnabled?'Collapse minimap':'Expand minimap';
 if(!minimapEnabled)return;
 if(!mini){mini=L.map('minimap',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,touchZoom:false,keyboard:false,zoomAnimation:false,zoomSnap:0});miniTiles=new RetainedTiles(tileURL,{maxZoom:24,maxNativeZoom:19}).addTo(mini);L.polyline(segments,{color:'#2878d7',weight:2,interactive:false}).addTo(mini);viewport=L.rectangle(map.getBounds(),{color:'#343e49',weight:1,fillColor:'#343e49',fillOpacity:.12,interactive:false}).addTo(mini);mini.on('click',e=>map.panTo(e.latlng));}
 const size=mini.getSize(),element=document.getElementById('minimap');
 if(size.x!==element.clientWidth||size.y!==element.clientHeight||!mini._loaded){mini.invalidateSize({pan:false});mini.fitBounds(line.getBounds(),{padding:[12,12],maxZoom:18,animate:false});}
 if(!viewport.getBounds().equals(visibleBounds))viewport.setBounds(visibleBounds);
}
collapse.onclick=e=>{e.stopPropagation();minimapEnabled=!minimapEnabled;window.webkit?.messageHandlers?.minimapPreference?.postMessage(minimapEnabled);updateMinimap();};
let zoomFrame=0,targetZoom=null,zoomAnchor=null,anchorLatLng=null,zoomIdleTimer=0,zoomGesture=false;
function finishZoomGesture(){
 clearTimeout(zoomIdleTimer);
 if(zoomGesture){zoomGesture=false;map._moveEnd(true);map.fire('viewreset');}
 targetZoom=null;
}
function stopSmoothZoom(){cancelAnimationFrame(zoomFrame);zoomFrame=0;finishZoomGesture();}
function smoothZoom(){
 zoomFrame=0;if(targetZoom===null)return;
 if(!zoomGesture){zoomGesture=true;map._moveStart(true,false);}
 // Follow the OS-provided wheel momentum directly: one update per display frame,
 // with no second inertia filter or repeated full view resets.
 const center=map.unproject(map.project(anchorLatLng,targetZoom).subtract(zoomAnchor.subtract(map.getSize().divideBy(2))),targetZoom);
 map._move(center,targetZoom,{pinch:true});
}
map.getContainer().addEventListener('wheel',e=>{
 e.preventDefault();
 if(!zoomGesture&&!zoomFrame)map.stop();
 zoomAnchor=map.mouseEventToContainerPoint(e);
 anchorLatLng=map.containerPointToLatLng(zoomAnchor);
 const delta=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?map.getSize().y:1);
 targetZoom=Math.max(map.getMinZoom(),Math.min(24,(targetZoom??map.getZoom())-delta/(e.ctrlKey?90:240)));
 if(!zoomFrame)zoomFrame=requestAnimationFrame(smoothZoom);
 clearTimeout(zoomIdleTimer);zoomIdleTimer=setTimeout(()=>{if(zoomFrame){cancelAnimationFrame(zoomFrame);smoothZoom();}finishZoomGesture();},70);
},{passive:false});
map.getContainer().addEventListener('mousedown',stopSmoothZoom);
function fit(){
 stopSmoothZoom();map.stop();fitting=true;map.invalidateSize();
 const size=map.getSize();
 // A 3⅓% buffer per side, with a minimum margin for endpoint markers.
 map.fitBounds(line.getBounds(),{padding:[Math.max(12,size.x/32),Math.max(12,size.y/32)],maxZoom:18,animate:false});
 fitZoom=map.getZoom();fitting=false;updateMinimap();
}
document.getElementById('fit').onclick=fit;
map.on('move zoom zoomanim',updateMinimap);
map.on('moveend zoomend',updateTileStatus);
let resizeTimer;new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const wasFitted=Math.abs(map.getZoom()-fitZoom)<.01&&map.getBounds().contains(line.getBounds());map.invalidateSize({pan:false});if(wasFitted)fit();else updateMinimap();},80);}).observe(document.getElementById('map'));
fit();
</script></body></html>
